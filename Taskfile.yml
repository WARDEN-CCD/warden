# Hub tasks. Repo-specific tasks live in each repo's own Taskfile (ADR-021).
version: '3'

# Machine-specific settings (never committed). WARDEN_JAVA_HOME selects JDK 25 for Warden builds only.
dotenv: ['{{.USERPROFILE}}/.warden/env', '{{.HOME}}/.warden/env']

vars:
  PY: '{{if eq OS "windows"}}./.venv/Scripts/python.exe{{else}}./.venv/bin/python{{end}}'
  # Prefix for Maven commands. Task's `env:` cannot override a JAVA_HOME already set in the OS, so it is set inline.
  WITH_JDK: 'JAVA_HOME="{{.WARDEN_JAVA_HOME | default .JAVA_HOME}}"'

tasks:
  venv:
    desc: Create the hub virtualenv and install dev requirements
    status:
      - test -f {{.PY}}
    cmds:
      - python -m venv .venv
      - '{{.PY}} -m pip install -r requirements-dev.txt'

  doctor:
    desc: Check local tooling against versions.yaml
    deps: [venv]
    cmds:
      - '{{.PY}} scripts/doctor.py'

  jdk:
    desc: Show which JDK Warden's Maven builds use
    cmds:
      - '{{.WITH_JDK}} mvn -v'

  verify:
    desc: Workspace checks (YAML, SHA pins, links, threat IDs)
    deps: [venv]
    cmds:
      - '{{.PY}} scripts/verify.py'

  up:local:
    desc: Create the kind cluster and bootstrap GitOps (delegates to warden-infra)
    cmds:
      - task -d warden-infra up:local

  down:local:
    desc: Delete the kind cluster
    cmds:
      - task -d warden-infra down:local
